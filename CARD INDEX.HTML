<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문자 인코딩 및 뷰포트 설정 -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Justin | 웹 명함</title>

  <!-- 외부 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 페이지 전체 중앙 배치 컨테이너 -->
  <main class="page">

    <!-- 명함 카드 영역 -->
    <section class="card" aria-label="개인 명함">

      <!-- 프로필 아바타: 이미지 대신 이니셜 사용 -->
      <div class="avatar" aria-hidden="true">JU</div>

      <!-- 이름 및 직함 -->
      <h1 class="name">Justin</h1>
      <p class="title">Trader</p>

      <!-- 한 줄 자기소개 -->
      <p class="bio">사용자 경험을 고민하는 개발자입니다.</p>

      <!-- 구분선 -->
      <div class="divider" aria-hidden="true"></div>

      <!-- 연락처 영역 -->
      <address class="contact">
        <!-- 이메일 버튼: mailto 링크 + 클립보드 복사 기능 (아이콘은 CSS ::before) -->
        <a
          class="email-btn"
          href="mailto:nsync123justin0324@gmail.com"
          data-email="nsync123justin0324@gmail.com"
          id="emailBtn"
        >nsync123justin0324@gmail.com</a>
      </address>

    </section>

    <!-- 클립보드 복사 후 표시되는 토스트 알림 -->
    <div class="toast" id="toast" role="status" aria-live="polite">
      이메일 주소가 복사되었습니다!
    </div>

  </main>

  <!-- 인터랙션 스크립트 (defer로 DOM 파싱 후 실행) -->
  <script src="script.js" defer></script>
</body>
</html>

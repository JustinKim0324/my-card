<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문자 인코딩 및 뷰포트 설정 -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Justin | 웹 명함</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">

    <!-- 명함 카드 -->
    <section class="card" aria-label="개인 명함">
      <div class="avatar" aria-hidden="true">JU</div>
      <h1 class="name">Justin</h1>
      <p class="title">Trader</p>
      <p class="bio">사용자 경험을 고민하는 개발자입니다.</p>
      <div class="divider" aria-hidden="true"></div>
      <address class="contact">
        <a
          class="email-btn"
          href="mailto:nsync123justin0324@gmail.com"
          data-email="nsync123justin0324@gmail.com"
          id="emailBtn"
        >nsync123justin0324@gmail.com</a>
      </address>
    </section>

    <!-- ============================================================
         날씨 방송 위젯
         data-wx 속성이 JS에 의해 날씨 상태로 변경되어 배경 테마 전환
         ============================================================ -->
    <div class="weather-cast" data-wx="loading" id="weatherCast">

      <!-- 애니메 기상캐스터 캐릭터 + 말풍선 -->
      <div class="wx-char-wrap">

        <!-- 애니메 캐릭터 이미지 -->
        <img class="wx-caster-svg" src="anime-girl.png" alt="기상캐스터 캐릭터" aria-hidden="true"/>

          <!-- 눈 (왼쪽) -->
          <ellipse cx="33" cy="28" rx="6" ry="7.5" fill="white"/>
          <ellipse cx="33" cy="29" rx="5" ry="6.5" fill="#7c3aed"/>
          <g class="wx-eye-l">
            <ellipse cx="33" cy="30" rx="3.5" ry="4.5" fill="#1e1b4b"/>
          </g>
          <circle cx="35.5" cy="26" r="1.8" fill="white"/>
          <circle cx="32"   cy="32" r="0.8" fill="white" opacity="0.6"/>
          <!-- 속눈썹 -->
          <path d="M27 22 Q33 19 39 22" stroke="#2d1b69" stroke-width="2.2" fill="none" stroke-linecap="round"/>

          <!-- 눈 (오른쪽) -->
          <ellipse cx="47" cy="28" rx="6" ry="7.5" fill="white"/>
          <ellipse cx="47" cy="29" rx="5" ry="6.5" fill="#7c3aed"/>
        <!-- 말풍선 (JS로 텍스트 주입) -->
        <div class="wx-speech" id="wxSpeech">날씨 불러오는 중...</div>
      </div>

      <!-- 날씨 정보 패널 -->
      <div class="wx-panel">
        <!-- 날씨 아이콘 애니메이션 (기존 로직 재사용) -->
        <div class="weather-anim" id="weatherAnim"></div>
        <div class="wx-panel-info">
          <p class="weather-temp" id="weatherTemp">--°C</p>
          <p class="weather-desc" id="weatherDesc">--</p>
          <p class="weather-loc">📍 서울</p>
        </div>
      </div>

    </div><!-- /.weather-cast -->

    <!-- 실시간 달러 환율 위젯 -->
    <div class="rate-widget">
      <span class="rate-icon">💵</span>
      <span class="rate-text" id="rateText">불러오는 중...</span>
    </div>

    <!-- 클립보드 복사 토스트 알림 -->
    <div class="toast" id="toast" role="status" aria-live="polite">
      이메일 주소가 복사되었습니다!
    </div>

  </main>

  <script src="script.js" defer></script>
</body>
</html>
